
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CyberTrack AI</title>
<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:#080d18;
  color:white;
  text-align:center;
}
header{
  padding:25px;
  background:#111b2e;
  font-size:25px;
  font-weight:bold;
}
main{
  max-width:600px;
  margin:45px auto;
  padding:25px;
}
.panel{
  background:#142139;
  border:1px solid #263b5b;
  padding:25px;
  border-radius:15px;
}
button{
  padding:14px 22px;
  margin:8px;
  border:0;
  border-radius:8px;
  background:#1685ed;
  color:white;
  font-size:16px;
  cursor:pointer;
}
#result{
  margin-top:20px;
  padding:15px;
  background:#0b1425;
  border-radius:8px;
  overflow-wrap:anywhere;
}
.small{color:#aabbd2;font-size:14px}
</style>
</head>
<body>
<header>🛡️ CYBERTRACK AI</header>
<main>
  <div class="panel">
    <h2>Personal Location Sharing</h2>
    <p class="small">
      Location sharing is optional.
      Your browser will ask for permission.
    </p>
    <button id="start">Share My Location</button>
    <button id="stop">Stop Sharing</button>
    <div id="result">Location sharing is OFF.</div>
  </div>
  <p class="small">
    Your location is displayed on this device only
    in this demo. It is not uploaded or shared.
  </p>
</main>
<script>
let watchId = null;
const result = document.getElementById("result");

document.getElementById("start").onclick = () => {
  if (!navigator.geolocation) {
    result.textContent = "GPS is not supported.";
    return;
  }

  if (watchId !== null) return;

  result.textContent = "Waiting for GPS permission...";

  watchId = navigator.geolocation.watchPosition(
    (position) => {
      const lat = position.coords.latitude;
      const lon = position.coords.longitude;
      const accuracy = position.coords.accuracy;

      result.innerHTML =
        "<b>Location Sharing: ON</b><br><br>" +
        "Latitude: " + lat + "<br>" +
        "Longitude: " + lon + "<br>" +
        "Accuracy: " + Math.round(accuracy) + " meters";
    },
    (error) => {
      result.textContent = "Location unavailable: " + error.message;
    },
    {
      enableHighAccuracy: true,
      maximumAge: 0,
      timeout: 15000
    }
  );
};

document.getElementById("stop").onclick = () => {
  if (watchId !== null) {
    navigator.geolocation.clearWatch(watchId);
    watchId = null;
  }
  result.textContent = "Location sharing is OFF.";
};
</script>
</body>
</html>
